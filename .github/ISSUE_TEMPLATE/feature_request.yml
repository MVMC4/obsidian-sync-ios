name: Feature request
description: Propose a focused, data-safe improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem or limitation should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the workflow and visible result.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Data-safety and platform considerations
      description: Explain effects on deletions, conflicts, bookmarks, background execution, signing, diagnostics, or migration.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would be willing to help implement or test this feature.
