name: Bug report
description: Report a reproducible Vault Sync problem using disposable or backed-up data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Remove credentials, full device IDs, private addresses, signing material, and vault content. Use the Security policy for vulnerabilities.
  - type: input
    id: commit
    attributes:
      label: Tested commit and Actions run
      description: Include the commit SHA and GitHub Actions run used to build the IPA.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Windows version, iPad model/iPadOS, Syncthing version, Sideloadly version, and USB or Wi-Fi installation.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use numbered steps and say whether the vault was disposable and backed up.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the visible session phase, percentage, and redacted error text.
    validations:
      required: true
  - type: dropdown
    id: data_loss
    attributes:
      label: Was content lost or overwritten?
      options:
        - "No"
        - "Possibly"
        - "Yes — I am using a backup and have removed private content from this report"
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics or screenshots
      description: Attach only output you have checked for private data.
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed credentials, full device IDs, private addresses, signing material, and vault content.
          required: true
        - label: I understand public issues are not a private security channel.
          required: true
