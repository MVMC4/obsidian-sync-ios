name: iOS checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Go core for iOS
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache: false

      - name: Build XCFramework
        run: ./scripts/build-core-xcframework.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: ./scripts/generate-xcode-project.sh

      - name: Compile linked app for iOS Simulator
        run: >-
          xcodebuild
          -project app/ObsidianSync.xcodeproj
          -scheme ObsidianSync
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Test linked app on an iPad Simulator
        shell: bash
        run: |
          simulator_list="$RUNNER_TEMP/ios-simulators.json"
          xcrun simctl list devices available -j > "$simulator_list"
          destination_id="$(python3 - "$simulator_list" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              runtimes = json.load(handle)["devices"]

          available = [
              device
              for runtime, devices in runtimes.items()
              if ".iOS-" in runtime
              for device in devices
              if device.get("isAvailable", False)
          ]
          ipads = [device for device in available if device["name"].startswith("iPad")]
          candidates = ipads or available
          if not candidates:
              raise SystemExit("No available iOS Simulator was found")
          print(candidates[0]["udid"])
          PY
          )"

          xcodebuild \
            -project app/ObsidianSync.xcodeproj \
            -scheme ObsidianSync \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$destination_id" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Inspect framework slices
        run: |
          test -d core/build/Mobilecore.xcframework
          find core/build/Mobilecore.xcframework -maxdepth 3 -type f -print | sort

      - name: Upload XCFramework
        uses: actions/upload-artifact@v7
        with:
          name: Mobilecore-xcframework
          path: core/build/Mobilecore.xcframework
          retention-days: 7
