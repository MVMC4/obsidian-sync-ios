name: iOS checks

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Go core for iOS
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: core/go.mod
          cache: false

      - name: Build XCFramework
        run: ./scripts/build-core-xcframework.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: ./scripts/generate-xcode-project.sh

      - name: Compile linked app for iOS Simulator
        run: >-
          xcodebuild
          -project app/ObsidianSync.xcodeproj
          -scheme ObsidianSync
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Test linked app on an iPad Simulator
        shell: bash
        run: |
          simulator_list="$RUNNER_TEMP/ios-simulators.json"
          xcrun simctl list devices available -j > "$simulator_list"
          destination_id="$(python3 - "$simulator_list" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              runtimes = json.load(handle)["devices"]

          available = [
              device
              for runtime, devices in runtimes.items()
              if ".iOS-" in runtime
              for device in devices
              if device.get("isAvailable", False)
          ]
          ipads = [device for device in available if device["name"].startswith("iPad")]
          candidates = ipads or available
          if not candidates:
              raise SystemExit("No available iOS Simulator was found")
          print(candidates[0]["udid"])
          PY
          )"

          xcodebuild \
            -project app/ObsidianSync.xcodeproj \
            -scheme ObsidianSync \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$destination_id" \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Package unsigned app for a physical iPad
        shell: bash
        run: |
          derived_data="$RUNNER_TEMP/device-derived-data"
          package_root="$RUNNER_TEMP/device-package"
          ipa_path="$GITHUB_WORKSPACE/ObsidianSync-unsigned.ipa"

          xcodebuild \
            -project app/ObsidianSync.xcodeproj \
            -scheme ObsidianSync \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$derived_data" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

          app_path="$derived_data/Build/Products/Debug-iphoneos/ObsidianSync.app"
          test -d "$app_path"
          test -x "$app_path/ObsidianSync"

          architectures="$(lipo -archs "$app_path/ObsidianSync")"
          case " $architectures " in
            *" arm64 "*) ;;
            *)
              echo "Expected an arm64 device binary, found: $architectures" >&2
              exit 1
              ;;
          esac

          rm -rf "$package_root"
          mkdir -p "$package_root/Payload"
          ditto "$app_path" "$package_root/Payload/ObsidianSync.app"
          (
            cd "$package_root"
            ditto -c -k --sequesterRsrc --keepParent Payload "$ipa_path"
          )

          shasum -a 256 "$ipa_path" | tee "$ipa_path.sha256"

      - name: Upload unsigned physical-device IPA
        uses: actions/upload-artifact@v7
        with:
          name: ObsidianSync-unsigned-device-ipa
          path: |
            ObsidianSync-unsigned.ipa
            ObsidianSync-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Inspect framework slices
        run: |
          test -d core/build/Mobilecore.xcframework
          find core/build/Mobilecore.xcframework -maxdepth 3 -type f -print | sort

      - name: Upload XCFramework
        uses: actions/upload-artifact@v7
        with:
          name: Mobilecore-xcframework
          path: core/build/Mobilecore.xcframework
          retention-days: 7
